name: Checks

# Runs the checks listed in REBUILD_PLAN.md section 3 ("CI job: exactly what to run").
# Pass rule for every Godot command (same as tools/Godot.ps1): exit code 0, no output
# line starting with "ERROR:" or "SCRIPT ERROR:", and done within 30 s (import: 10 min).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_EXPECTED_VERSION: 4.7.2.stable.official.ed1daf0bf
  GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install "psycopg[binary]==3.2.10"

      - name: Install Godot 4.7.2 (Linux, headless)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          echo "${GODOT_SHA512}  ${GODOT_ZIP}" | sha512sum -c -
          unzip -q "$GODOT_ZIP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv Godot_v4.7.2-stable_linux.x86_64 "$RUNNER_TEMP/bin/godot"
          chmod +x "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          ver="$("$RUNNER_TEMP/bin/godot" --headless --version | tail -n1 | tr -d '\r')"
          echo "godot --version: $ver"
          if [ "$ver" != "$GODOT_EXPECTED_VERSION" ]; then
            echo "Expected $GODOT_EXPECTED_VERSION, got $ver"; exit 1
          fi

      - name: Prepare environment and runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdg/data" "$RUNNER_TEMP/xdg/config" "$RUNNER_TEMP/xdg/cache" "$RUNNER_TEMP/logs"
          {
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
            echo "LOG_DIR=$RUNNER_TEMP/logs"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/bin/run_godot" <<'EOF'
          #!/usr/bin/env bash
          # usage: run_godot <name> <timeout-seconds> <godot args...>
          name="$1"; limit="$2"; shift 2
          log="$LOG_DIR/$name.log"
          echo "::group::godot $*"
          timeout --kill-after=5 "$limit" godot "$@" > "$log" 2>&1
          code=$?
          cat "$log"
          echo "::endgroup::"
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "FAIL $name: timed out after ${limit}s"; echo "FAIL $name (timeout)" >> "$LOG_DIR/summary.txt"; exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "FAIL $name: exit code $code"; echo "FAIL $name (exit $code)" >> "$LOG_DIR/summary.txt"; exit 1
          fi
          if grep -qE '^(ERROR:|SCRIPT ERROR:)' "$log"; then
            echo "FAIL $name: ERROR line in output"; grep -E '^(ERROR:|SCRIPT ERROR:)' "$log" | head -20
            echo "FAIL $name (error lines)" >> "$LOG_DIR/summary.txt"; exit 1
          fi
          echo "PASS $name" | tee -a "$LOG_DIR/summary.txt"
          EOF
          chmod +x "$RUNNER_TEMP/bin/run_godot"

      - name: "Stage 1: import, parse, boot"
        id: stage1
        run: |
          set -uo pipefail
          fail=0
          run_godot import 600 --headless --path . --editor --import || fail=1
          run_godot check_scripts 30 --headless --path . --script res://tools/check_scripts.gd || fail=1
          run_godot boot 30 --headless --path . --quit-after 10 || fail=1
          exit $fail

      - name: "Stage 2: Godot smoke set"
        id: stage2
        if: always()
        run: |
          set -uo pipefail
          fail=0
          for s in units_probe; do run_godot "$s" 30 --headless --path . --scene "res://tools/$s.tscn" || fail=1; done
          run_godot check_catalog 30 --headless --path . --script res://tools/check_catalog.gd || fail=1
          run_godot diagnostics_probe 30 --headless --path . --scene res://tools/diagnostics_probe.tscn || fail=1
          for c in check_controls check_flow check_starter; do
            run_godot "$c" 30 --headless --path . --script "res://tools/$c.gd" || fail=1
          done
          for s in contracts_probe geography_probe session_probe clocks_probe handling_probe \
                   camera_probe water_probe feedback_probe world_size_probe heavy_lifter_probe \
                   fuel_probe economy_probe; do
            run_godot "$s" 30 --headless --path . --scene "res://tools/$s.tscn" || fail=1
          done
          exit $fail

      - name: "Stage 3: Python"
        id: stage3
        if: always()
        run: |
          set -uo pipefail
          fail=0
          python3 -m compileall -q services tools || fail=1
          python3 -m unittest -v \
            services.test_cargo_matrix \
            services.heavy_load.test_private \
            services.heavy_load.test_transport \
            services.heavy_load.test_variants \
            services.oil_market.test_model \
            services.oil_market.test_settlement \
            services.oil_market.test_interface \
            services.refinery.test_processing \
            services.refinery.test_shared \
            services.refinery.test_cargo_fuel || fail=1
          python3 -m unittest discover -v -s tools/public_handoff -p 'test_*.py' || fail=1
          python3 -m unittest discover -v -s tools/world_layout -p 'test_*.py' || fail=1
          python3 tools/world_layout/traversal_budget.py || fail=1
          exit $fail

      - name: "Stage 4: report only (does not fail the job)"
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          for s in collision_probe composition_probe ports_probe; do
            run_godot "report_$s" 30 --headless --path . --scene "res://tools/$s.tscn" || true
          done

      - name: Summary
        if: always()
        run: |
          echo "## Godot check results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG_DIR/summary.txt" ]; then sed 's/^/- /' "$LOG_DIR/summary.txt" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
